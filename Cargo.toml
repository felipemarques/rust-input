[workspace]
members = [
    "input-capture",
    "input-emulation",
    "input-event",
    "rustinput-ipc",
    "rustinput-cli",
    "rustinput-gtk",
    "rustinput-i18n",
    "rustinput-proto",
]

[package]
name = "rustinput"
description = "Software KVM Switch / mouse & keyboard sharing software for Local Area Networks"
version = "0.53.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/felipemarques/rust-input"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"

[build-dependencies]
shadow-rs = "1.2.0"
embed-resource = "3.0.12"

[dependencies]
input-event = { path = "input-event", version = "0.4.0" }
input-emulation = { path = "input-emulation", version = "0.4.0", default-features = false }
input-capture = { path = "input-capture", version = "0.4.0", default-features = false }
rustinput-cli = { path = "rustinput-cli", version = "0.3.0" }
rustinput-gtk = { path = "rustinput-gtk", version = "0.3.0", optional = true }
rustinput-ipc = { path = "rustinput-ipc", version = "0.3.0" }
rustinput-i18n = { path = "rustinput-i18n", version = "0.1.0" }
rustinput-proto = { path = "rustinput-proto", version = "0.4.0" }
shadow-rs = { version = "1.2.0", features = ["metadata"] }

toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4.20"
env_logger = "0.11.3"
serde_json = "1.0.107"
tokio = { version = "1.32.0", features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "signal",
    "fs",
    "time",
] }
futures = "0.3.28"
clap = { version = "4.4.11", features = ["derive"] }
slab = "0.4.9"
thiserror = "2.0.0"
tokio-util = "0.7.11"
local-channel = "0.1.5"
webrtc-dtls = { version = "0.12.0", features = ["pem"] }
webrtc-util = "0.11.0"
async-trait = "0.1.92"
rustls = { version = "0.23.12", default-features = false, features = [
    "std",
    "ring",
] }
rcgen = "0.13.1"
sha2 = "0.10.8"
# the signature of the checksums of a release, for installing a new version
# (src/self_update.rs); already here through rustls
ring = "0.17.14"
notify = "8.2.0"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
png = "0.18.1"
# ring like the rest of rustls here: aws-lc-rs needs CMake and NASM on Windows
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
# the certificates of the system, to ask GitHub for the latest version (src/update.rs)
rustls-native-certs = "0.8.1"
# authorizing two devices on each other with a code (see src/pairing.rs)
spake2 = { version = "0.4.0", features = ["getrandom"] }
getrandom = "0.3.4"
hostname = "0.4.2"
# the sockets of the discovery: shared port, broadcasts
socket2 = "0.6"
# drawing the radial menu (see src/radial)
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
# the labels of the radial menu: glyphs read when drawn, so fonts with all
# of Chinese or Japanese cost no time or memory at start
ab_glyph = "0.2.29"
# Arabic in the radial menu: its letters joined and from right to left
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2.148"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.14.0", features = ["xinput", "shape", "randr", "xfixes"] }

[target.'cfg(target_os = "linux")'.dependencies]
# the shared sound (src/sound/linux.rs): libpulse, which PulseAudio and
# PipeWire both answer and every desktop has
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

[target.'cfg(windows)'.dependencies]
# received files go to the clipboard as cut files (arboard can only copy)
clipboard-win = "5.4.3"
# the Windows service that keeps the daemon running (windows_supervisor.rs)
windows-service = "0.8.1"
# the shared sound (src/sound/win.rs): recording the output in loopback and
# playing, through WASAPI
cpal = "0.18.2"
# the rules of the Windows firewall the installer sets (windows_setup.rs);
# muting the output while its sound goes to another computer (sound/win.rs)
windows = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.25.0"
tokio = { version = "1.32.0", features = ["macros", "rt", "io-util", "fs", "time"] }

[features]
default = [
    "gtk",
    "layer_shell_capture",
    "x11_capture",
    "libei_capture",
    "wlroots_emulation",
    "libei_emulation",
    "rdp_emulation",
    "x11_emulation",
]
gtk = ["dep:rustinput-gtk"]
layer_shell_capture = ["input-capture/layer_shell"]
x11_capture = ["input-capture/x11"]
libei_capture = ["input-event/libei", "input-capture/libei"]
libei_emulation = ["input-event/libei", "input-emulation/libei"]
wlroots_emulation = ["input-emulation/wlroots"]
x11_emulation = ["input-emulation/x11"]
rdp_emulation = ["input-emulation/remote_desktop_portal"]

[package.metadata.bundle]
name = "RustInput"
icon = ["target/icon.icns", "rustinput-gtk/resources/io.github.felipemarques.RustInput.svg"]
identifier = "io.github.felipemarques.RustInput"
deb_depends = [ "libadwaita-1-0", "libpulse0" ]
resources = ["target/menubar-template.png"]

[package.metadata.bundle.osx]
info_plist_exts = ["build-aux/macos-lsui-element.plist"]

