[package]
name = "rustinput-ipc"
description = "library for communication between rustinput service and frontends"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/felipemarques/rust-input"

[dependencies]
futures = "0.3.30"
log = "0.4.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
thiserror = "2.0.0"
tokio = { version = "1.32.0", features = ["macros", "net", "io-util", "time", "rt", "sync"] }
tokio-stream = { version = "0.1.15", features = ["io-util"] }

[target.'cfg(windows)'.dependencies]
# whether the Windows service keeps the daemon running
windows-service = "0.8.1"
