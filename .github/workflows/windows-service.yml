name: Windows service

# installs the Windows service with update-rustinput.ps1 on a Windows runner,
# checks it starts the daemon, and removes it (.github/windows-service-test.ps1)
on:
  push:
    paths:
      - 'src/**'
      - 'rustinput-ipc/**'
      - 'scripts/update-rustinput.ps1'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/windows-service-test.ps1'
      - '.github/workflows/windows-service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  service:
    name: install, run and remove the service
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-service
      # the service starts only the daemon, which needs no GTK
      - name: cargo build
        run: cargo build --release --no-default-features
      - name: install, run and remove
        shell: powershell
        run: .\.github\windows-service-test.ps1
