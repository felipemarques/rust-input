name: "Release"
run-name: "Release - ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.name || github.ref_name }}"

on:
  push:
    branches: [ "main" ]
    tags:
      - v**
  workflow_dispatch:
    inputs:
      name:
        description: 'Development release name'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  linux-release-build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev
        sudo apt-get install libadwaita-1-dev libgtk-4-dev libpulse-dev
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/rustinput rustinput-linux-x86_64
    - name: Install cargo bundle
      run: cargo install cargo-bundle --locked --version 0.12.0
    - name: Bundle
      run: |
        cargo bundle --release
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: rustinput-linux-x86_64
        path: |
          rustinput-linux-x86_64
          target/release/bundle/deb/rustinput_*.deb
          target/release/bundle/appimage/rustinput_*.AppImage

  linux-arm64-release-build:
    runs-on: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev
        sudo apt-get install libadwaita-1-dev libgtk-4-dev libpulse-dev
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/rustinput rustinput-linux-arm64
    - name: Install cargo bundle
      run: cargo install cargo-bundle --locked --version 0.12.0
    - name: Bundle
      run: |
        cargo bundle --release
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: rustinput-linux-arm64
        path: |
          rustinput-linux-arm64
          target/release/bundle/deb/rustinput_*.deb
          target/release/bundle/appimage/rustinput_*.AppImage

  windows-release-build:
    runs-on: windows-latest
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    # needed for cache restore
    - name: create gtk dir
      run: mkdir C:\gtk-build\gtk\x64\release
    - uses: actions/cache@v3
      id: cache
      with:
        path: c:/gtk-build/gtk/x64/release/**
        key: gtk-windows-build
        restore-keys: gtk-windows-build
    - name: Update path
      run: |
        echo "PKG_CONFIG=C:\gtk-build\gtk\x64\release\bin\pkgconf.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "C:\pkg-config-lite-0.28-1\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "C:\gtk-build\gtk\x64\release\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo $env:GITHUB_PATH
        echo $env:PATH
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        # choco install msys2
        # choco install visualstudio2022-workload-vctools
        # choco install pkgconfiglite
        py -m venv .venv
        .venv\Scripts\activate.ps1
        py -m pip install gvsbuild
        # see https://github.com/wingtk/gvsbuild/pull/1004
        Move-Item "C:\Program Files\Git\usr\bin" "C:\Program Files\Git\usr\notbin"
        Move-Item "C:\Program Files\Git\bin" "C:\Program Files\Git\notbin"
        gvsbuild build --vs-ver=vs2026 --msys-dir=C:\msys64 gtk4 libadwaita librsvg
        Move-Item "C:\Program Files\Git\usr\notbin" "C:\Program Files\Git\usr\bin"
        Move-Item "C:\Program Files\Git\notbin" "C:\Program Files\Git\bin"
    - uses: actions/checkout@v6
    - name: Release Build
      run: cargo build --release
    - name: Create Archive
      run: |
        mkdir "rustinput-windows"
        Get-Childitem -Path "C:\\gtk-build\\gtk\\x64\\release\\bin\\*.dll" -File -Recurse | Copy-Item -Destination "rustinput-windows"
        Copy-Item -Path "target\release\rustinput.exe" -Destination "rustinput-windows"
        Copy-Item -Path "scripts\update-rustinput.ps1" -Destination "rustinput-windows"
        Compress-Archive -Path "rustinput-windows\*" -DestinationPath rustinput-windows-x86_64.zip
    # the same files, with the service, the firewall and Settings > Apps
    - name: Create Installer
      run: .\build-aux\windows\build-setup.ps1 -PackageDir rustinput-windows -OutputDir .
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: rustinput-windows-x86_64
        path: |
          rustinput-windows-x86_64.zip
          rustinput-windows-x86_64-setup.exe

  macos-release-build:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        brew install gtk4 libadwaita imagemagick librsvg
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/rustinput rustinput-macos-intel
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle --locked --version 0.12.0
    - name: Bundle
      run: |
        cargo bundle --release
        scripts/copy-macos-dylib.sh "target/release/bundle/osx/RustInput.app/Contents/MacOS/rustinput"
    - name: Zip bundle
      run: |
        cd target/release/bundle/osx
        zip -r "rustinput-macos-intel.zip" "RustInput.app"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: rustinput-macos-intel
        path: target/release/bundle/osx/rustinput-macos-intel.zip

  macos-arm64-release-build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        brew install gtk4 libadwaita imagemagick librsvg
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/rustinput rustinput-macos-arm64
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle --locked --version 0.12.0
    - name: Bundle
      run: |
        cargo bundle --release
        scripts/copy-macos-dylib.sh "target/release/bundle/osx/RustInput.app/Contents/MacOS/rustinput"
    - name: Zip bundle
      run: |
        cd target/release/bundle/osx
        zip -r "rustinput-macos-arm64.zip" "RustInput.app"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: rustinput-macos-arm64
        path: target/release/bundle/osx/rustinput-macos-arm64.zip

  release:
    name: "Release"
    needs: [windows-release-build, linux-release-build, linux-arm64-release-build, macos-release-build, macos-arm64-release-build]
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
    steps:
    - uses: actions/checkout@v6
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    # Decide what to publish:
    #   - a pushed tag (v*)                       -> release for that tag
    #   - a push to main whose Cargo.toml version
    #     has no v<version> tag yet               -> create the tag and a release
    #   - anything else                           -> pre-release named <ref>-<sha>
    - name: Determine release kind
      id: vars
      env:
        INPUT_NAME: ${{ github.event.inputs.name }}
      run: |
        short_sha="${GITHUB_SHA::7}"
        version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rustinput") | .version')"
        if [ -z "$version" ] || [ "$version" = "null" ]; then
          echo "could not read the rustinput version from Cargo.toml" >&2
          exit 1
        fi
        version_tag="v${version}"
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          tag_name="$GITHUB_REF_NAME"
          prerelease=false
        elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] \
            && [ -z "$(git ls-remote --tags origin "refs/tags/${version_tag}")" ]; then
          tag_name="$version_tag"
          prerelease=false
        else
          tag_name="${INPUT_NAME:-$GITHUB_REF_NAME}-${short_sha}"
          prerelease=true
        fi
        # Runs of several versions can be in flight at once and finish in any
        # order, and GitHub marks every new release as the latest one. Only the
        # highest version may become the latest, which `releases/latest` links
        # point to.
        make_latest=false
        if [ "$prerelease" = false ]; then
          highest="$({
            git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##'
            echo "$tag_name"
          } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$highest" = "$tag_name" ]; then
            make_latest=true
          fi
        fi
        echo "publishing ${tag_name} (prerelease: ${prerelease}, latest: ${make_latest})"
        {
          echo "tag_name=${tag_name}"
          echo "prerelease=${prerelease}"
          echo "make_latest=${make_latest}"
        } >> "$GITHUB_OUTPUT"
    # The checksums of the files for Linux and macOS, signed with the release
    # key (the repository secret RELEASE_SIGNING_KEY, Ed25519): RustInput
    # checks them against the public half built into it
    # (build-aux/release-key.pub) before it installs a new version
    # (src/self_update.rs). The Windows files are left out: SignPath may
    # replace them with signed ones after this job, and Windows checks their
    # Authenticode signature.
    - name: Sign the checksums
      env:
        RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      run: |
        mkdir -p checksums
        for f in rustinput-linux-x86_64/rustinput-linux-x86_64 \
                 rustinput-linux-x86_64/target/release/bundle/deb/rustinput_*.deb \
                 rustinput-linux-x86_64/target/release/bundle/appimage/rustinput_*.AppImage \
                 rustinput-linux-arm64/rustinput-linux-arm64 \
                 rustinput-linux-arm64/target/release/bundle/deb/rustinput_*.deb \
                 rustinput-linux-arm64/target/release/bundle/appimage/rustinput_*.AppImage \
                 rustinput-macos-intel/rustinput-macos-intel.zip \
                 rustinput-macos-arm64/rustinput-macos-arm64.zip; do
          (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
        done > checksums/SHA256SUMS
        cat checksums/SHA256SUMS
        if [ -z "$RELEASE_SIGNING_KEY" ]; then
          echo "::warning::no RELEASE_SIGNING_KEY: the checksums are not signed, and RustInput will not install this release by itself"
          exit 0
        fi
        umask 077
        key="$RUNNER_TEMP/release-signing-key.pem"
        printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
        openssl pkeyutl -sign -rawin -inkey "$key" -in checksums/SHA256SUMS -out checksums/SHA256SUMS.sig
        # the public half of the secret must be the one built into RustInput
        actual="$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | xxd -p -c 64)"
        rm -f "$key"
        if [ "$actual" != "$(tr -d '[:space:]' < build-aux/release-key.pub)" ]; then
          echo "RELEASE_SIGNING_KEY is not the key of build-aux/release-key.pub" >&2
          exit 1
        fi
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ steps.vars.outputs.tag_name }}
        name: ${{ steps.vars.outputs.tag_name }}
        target_commitish: ${{ github.sha }}
        prerelease: ${{ steps.vars.outputs.prerelease }}
        make_latest: ${{ steps.vars.outputs.make_latest }}
        generate_release_notes: true
        # before the generated notes
        body: |
          Windows: run `rustinput-windows-x86_64-setup.exe`, or update with `update-rustinput.ps1` (see the [README](https://github.com/felipemarques/rust-input#installation)). [Code signing policy](https://github.com/felipemarques/rust-input#code-signing-policy).
        files: |
          rustinput-linux-x86_64/rustinput-linux-x86_64
          rustinput-linux-x86_64/target/release/bundle/deb/rustinput_*.deb
          rustinput-linux-x86_64/target/release/bundle/appimage/rustinput_*.AppImage
          rustinput-linux-arm64/rustinput-linux-arm64
          rustinput-linux-arm64/target/release/bundle/deb/rustinput_*.deb
          rustinput-linux-arm64/target/release/bundle/appimage/rustinput_*.AppImage
          rustinput-macos-intel/rustinput-macos-intel.zip
          rustinput-macos-arm64/rustinput-macos-arm64.zip
          rustinput-windows-x86_64/rustinput-windows-x86_64.zip
          rustinput-windows-x86_64/rustinput-windows-x86_64-setup.exe
          scripts/update-rustinput.ps1
          checksums/SHA256SUMS
          checksums/SHA256SUMS.sig

  # Signs rustinput.exe and the installer with SignPath (DOC.md, "Signing the
  # Windows files") and puts the signed files in place of the published ones.
  # Off until the repository variable SIGNPATH_ORGANIZATION_ID exists:
  # deleting it turns signing off again. Releases of a version only, not the
  # pre-releases of every push to main. Each of the two requests waits for an
  # approval in SignPath; when that does not come in time this job fails, the
  # release keeps its unsigned files, and "Re-run failed jobs" asks again.
  windows-sign:
    name: "Sign the Windows files"
    needs: [release]
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && needs.release.outputs.prerelease == 'false' }}
    runs-on: windows-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v6
    - name: Download the Windows build
      uses: actions/download-artifact@v4
      with:
        name: rustinput-windows-x86_64
        path: unsigned
    - name: Unpack
      id: unpack
      run: |
        Expand-Archive -Path unsigned\rustinput-windows-x86_64.zip -DestinationPath package
        New-Item -ItemType Directory -Force exe | Out-Null
        Copy-Item package\rustinput.exe exe\
        $version = ([string](Get-Item package\rustinput.exe).VersionInfo.ProductVersion).Trim()
        if ("v$version" -ne $env:TAG) { throw "rustinput.exe is $version, the release $env:TAG" }
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
    - name: Upload rustinput.exe for signing
      id: upload-exe
      uses: actions/upload-artifact@v6
      with:
        name: unsigned-rustinput-exe
        path: exe/rustinput.exe
    - name: Sign rustinput.exe
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'rust-input' }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
        artifact-configuration-slug: rustinput-exe
        github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
        parameters: |
          version: ${{ toJSON(steps.unpack.outputs.version) }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 12600
        output-artifact-directory: signed-exe
    - name: Rebuild the zip and the installer with the signed rustinput.exe
      run: |
        $signature = Get-AuthenticodeSignature signed-exe\rustinput.exe
        if ($signature.Status -ne 'Valid') { throw "rustinput.exe is not signed: $($signature.Status) $($signature.StatusMessage)" }
        Write-Host "signed by: $($signature.SignerCertificate.Subject)"
        Copy-Item signed-exe\rustinput.exe package\rustinput.exe -Force
        New-Item -ItemType Directory -Force signed | Out-Null
        Compress-Archive -Path "package\*" -DestinationPath signed\rustinput-windows-x86_64.zip
        .\build-aux\windows\build-setup.ps1 -PackageDir package -OutputDir setup
    - name: Upload the installer for signing
      id: upload-setup
      uses: actions/upload-artifact@v6
      with:
        name: unsigned-rustinput-setup
        path: setup/rustinput-windows-x86_64-setup.exe
    - name: Sign the installer
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'rust-input' }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
        artifact-configuration-slug: rustinput-setup
        github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
        parameters: |
          version: ${{ toJSON(steps.unpack.outputs.version) }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 7200
        output-artifact-directory: signed-setup
    - name: Put the signed files in the release
      run: |
        $signature = Get-AuthenticodeSignature signed-setup\rustinput-windows-x86_64-setup.exe
        if ($signature.Status -ne 'Valid') { throw "the installer is not signed: $($signature.Status) $($signature.StatusMessage)" }
        Copy-Item signed-setup\rustinput-windows-x86_64-setup.exe signed\
        gh release upload $env:TAG signed\rustinput-windows-x86_64.zip signed\rustinput-windows-x86_64-setup.exe --clobber --repo $env:GITHUB_REPOSITORY
