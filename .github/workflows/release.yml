name: "Release"
run-name: "Release - ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.name || github.ref_name }}"

on:
  push:
    branches: [ "main" ]
    tags:
      - v**
  workflow_dispatch:
    inputs:
      name:
        description: 'Development release name'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  linux-release-build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev
        sudo apt-get install libadwaita-1-dev libgtk-4-dev
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/rustinput rustinput-linux-x86_64
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: rustinput-linux-x86_64
        path: |
          rustinput-linux-x86_64
          target/release/bundle/deb/rustinput_*.deb
          target/release/bundle/appimage/rustinput_*.AppImage

  linux-arm64-release-build:
    runs-on: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev
        sudo apt-get install libadwaita-1-dev libgtk-4-dev
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/rustinput rustinput-linux-arm64
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: rustinput-linux-arm64
        path: |
          rustinput-linux-arm64
          target/release/bundle/deb/rustinput_*.deb
          target/release/bundle/appimage/rustinput_*.AppImage

  windows-release-build:
    runs-on: windows-latest
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    # needed for cache restore
    - name: create gtk dir
      run: mkdir C:\gtk-build\gtk\x64\release
    - uses: actions/cache@v3
      id: cache
      with:
        path: c:/gtk-build/gtk/x64/release/**
        key: gtk-windows-build
        restore-keys: gtk-windows-build
    - name: Update path
      run: |
        echo "PKG_CONFIG=C:\gtk-build\gtk\x64\release\bin\pkgconf.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "C:\pkg-config-lite-0.28-1\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "C:\gtk-build\gtk\x64\release\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo $env:GITHUB_PATH
        echo $env:PATH
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        # choco install msys2
        # choco install visualstudio2022-workload-vctools
        # choco install pkgconfiglite
        py -m venv .venv
        .venv\Scripts\activate.ps1
        py -m pip install gvsbuild
        # see https://github.com/wingtk/gvsbuild/pull/1004
        Move-Item "C:\Program Files\Git\usr\bin" "C:\Program Files\Git\usr\notbin"
        Move-Item "C:\Program Files\Git\bin" "C:\Program Files\Git\notbin"
        gvsbuild build --vs-ver=vs2026 --msys-dir=C:\msys64 gtk4 libadwaita librsvg
        Move-Item "C:\Program Files\Git\usr\notbin" "C:\Program Files\Git\usr\bin"
        Move-Item "C:\Program Files\Git\notbin" "C:\Program Files\Git\bin"
    - uses: actions/checkout@v6
    - name: Release Build
      run: cargo build --release
    - name: Create Archive
      run: |
        mkdir "rustinput-windows"
        Get-Childitem -Path "C:\\gtk-build\\gtk\\x64\\release\\bin\\*.dll" -File -Recurse | Copy-Item -Destination "rustinput-windows"
        Copy-Item -Path "target\release\rustinput.exe" -Destination "rustinput-windows"
        Compress-Archive -Path "rustinput-windows\*" -DestinationPath rustinput-windows-x86_64.zip
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: rustinput-windows-x86_64
        path: rustinput-windows-x86_64.zip

  macos-release-build:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        brew install --cask inkscape
        brew install gtk4 libadwaita imagemagick librsvg
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/rustinput rustinput-macos-intel
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
        scripts/copy-macos-dylib.sh "target/release/bundle/osx/RustInput.app/Contents/MacOS/rustinput"
    - name: Zip bundle
      run: |
        cd target/release/bundle/osx
        zip -r "rustinput-macos-intel.zip" "RustInput.app"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: rustinput-macos-intel
        path: target/release/bundle/osx/rustinput-macos-intel.zip

  macos-arm64-release-build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        brew install --cask inkscape
        brew install gtk4 libadwaita imagemagick librsvg
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/rustinput rustinput-macos-arm64
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
        scripts/copy-macos-dylib.sh "target/release/bundle/osx/RustInput.app/Contents/MacOS/rustinput"
    - name: Zip bundle
      run: |
        cd target/release/bundle/osx
        zip -r "rustinput-macos-arm64.zip" "RustInput.app"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: rustinput-macos-arm64
        path: target/release/bundle/osx/rustinput-macos-arm64.zip

  release:
    name: "Release"
    needs: [windows-release-build, linux-release-build, linux-arm64-release-build, macos-release-build, macos-arm64-release-build]
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    # Decide what to publish:
    #   - a pushed tag (v*)                       -> release for that tag
    #   - a push to main whose Cargo.toml version
    #     has no v<version> tag yet               -> create the tag and a release
    #   - anything else                           -> pre-release named <ref>-<sha>
    - name: Determine release kind
      id: vars
      env:
        INPUT_NAME: ${{ github.event.inputs.name }}
      run: |
        short_sha="${GITHUB_SHA::7}"
        version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rustinput") | .version')"
        if [ -z "$version" ] || [ "$version" = "null" ]; then
          echo "could not read the rustinput version from Cargo.toml" >&2
          exit 1
        fi
        version_tag="v${version}"
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          tag_name="$GITHUB_REF_NAME"
          prerelease=false
        elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] \
            && [ -z "$(git ls-remote --tags origin "refs/tags/${version_tag}")" ]; then
          tag_name="$version_tag"
          prerelease=false
        else
          tag_name="${INPUT_NAME:-$GITHUB_REF_NAME}-${short_sha}"
          prerelease=true
        fi
        echo "publishing ${tag_name} (prerelease: ${prerelease})"
        {
          echo "tag_name=${tag_name}"
          echo "prerelease=${prerelease}"
        } >> "$GITHUB_OUTPUT"
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ steps.vars.outputs.tag_name }}
        name: ${{ steps.vars.outputs.tag_name }}
        target_commitish: ${{ github.sha }}
        prerelease: ${{ steps.vars.outputs.prerelease }}
        generate_release_notes: true
        files: |
          rustinput-linux-x86_64/rustinput-linux-x86_64
          rustinput-linux-x86_64/target/release/bundle/deb/rustinput_*.deb
          rustinput-linux-x86_64/target/release/bundle/appimage/rustinput_*.AppImage
          rustinput-linux-arm64/rustinput-linux-arm64
          rustinput-linux-arm64/target/release/bundle/deb/rustinput_*.deb
          rustinput-linux-arm64/target/release/bundle/appimage/rustinput_*.AppImage
          rustinput-macos-intel/rustinput-macos-intel.zip
          rustinput-macos-arm64/rustinput-macos-arm64.zip
          rustinput-windows-x86_64/rustinput-windows-x86_64.zip
