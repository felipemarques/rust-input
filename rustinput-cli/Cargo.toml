[package]
name = "rustinput-cli"
description = "CLI Frontend for rustinput"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/felipemarques/rust-input"

[dependencies]
futures = "0.3.30"
rustinput-ipc = { path = "../rustinput-ipc", version = "0.3.0" }
clap = { version = "4.4.11", features = ["derive"] }
thiserror = "2.0.0"
tokio = { version = "1.32.0", features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "rt",
] }
