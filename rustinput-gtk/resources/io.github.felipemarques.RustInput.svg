<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>RustInput</title>
  <desc>Two screens sharing a single pointer.</desc>
  <!-- left screen -->
  <g stroke="#CE412B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="12" width="26" height="21" rx="3.5" fill="#CE412B" fill-opacity="0.2"/>
    <path d="M16 33v7M9 41h14" fill="none"/>
  </g>
  <!-- right screen -->
  <g stroke="#F0883E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="35" y="12" width="26" height="21" rx="3.5" fill="#F0883E" fill-opacity="0.2"/>
    <path d="M48 33v7M41 41h14" fill="none"/>
  </g>
  <!-- pointer crossing from one screen to the other -->
  <path d="M25 20v27l6.75-6.75 4.5 9.75 4.5-1.95-4.35-9.6H46z"
        fill="#FFFFFF" stroke="#24292F" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
