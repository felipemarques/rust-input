[package]
name = "rustinput-gtk"
description = "GTK4 / Libadwaita Frontend for rustinput"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/felipemarques/rust-input"

[dependencies]
gtk = { package = "gtk4", version = "0.9.0", features = ["v4_2"] }
adw = { package = "libadwaita", version = "0.7.0", features = ["v1_1"] }
async-channel = { version = "2.1.1" }
hostname = "0.4.0"
log = "0.4.20"
rustinput-ipc = { path = "../rustinput-ipc", version = "0.3.0" }
rustinput-i18n = { path = "../rustinput-i18n", version = "0.1.0" }
thiserror = "2.0.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
png = "0.18.1"

[build-dependencies]
glib-build-tools = { version = "0.20.0" }
# the translations go into the windows when they are built
rustinput-i18n = { path = "../rustinput-i18n", version = "0.1.0" }
